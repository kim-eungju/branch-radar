<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" data-bs-theme="dark">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title th:text="${title} + ' · Branch Radar'">Branch Radar</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preload" th:href="@{/fonts/PretendardVariable.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- ============================================================ 아이콘 (Lucide 스타일, inline SVG) -->
<svg th:fragment="icon(name)" class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" th:switch="${name}">
    <th:block th:case="'radar'"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18.5 5.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></th:block>
    <th:block th:case="'dashboard'"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></th:block>
    <th:block th:case="'compare'"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/></th:block>
    <th:block th:case="'external'"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></th:block>
    <th:block th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></th:block>
    <th:block th:case="'swap'"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></th:block>
    <th:block th:case="'branch'"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></th:block>
    <th:block th:case="'db'"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></th:block>
    <th:block th:case="'tag'"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor"/></th:block>
    <th:block th:case="'alert'"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></th:block>
    <th:block th:case="'info'"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></th:block>
    <th:block th:case="'commit'"><circle cx="12" cy="12" r="3"/><line x1="3" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="21" y2="12"/></th:block>
    <th:block th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></th:block>
    <th:block th:case="'copy'"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></th:block>
    <th:block th:case="'filePlus'"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6"/><path d="M9 15h6"/><path d="M12 18v-6"/></th:block>
    <th:block th:case="'check'"><path d="M20 6 9 17l-5-5"/></th:block>
    <th:block th:case="'sort'"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h10"/><path d="M11 8h7"/><path d="M11 12h4"/></th:block>
</svg>

<!-- ============================================================ 상단 헤더 -->
<header th:fragment="topbar(active, projectName, projectWebUrl, connected)" class="br-header">
    <div id="topProgress"></div>
    <a class="br-brand" th:href="@{/}">
        <span class="logo"><svg th:replace="~{fragments/layout :: icon('radar')}"></svg></span>
        Branch Radar
    </a>
    <th:block th:if="${projectName != null}">
        <span class="br-crumb-sep">/</span>
        <span class="br-crumb" th:text="${projectName}">project</span>
    </th:block>
    <!-- 메뉴 (3개뿐이라 사이드바 대신 상단 바에 둔다) -->
    <nav class="br-topnav" aria-label="메뉴">
        <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'">
            <svg th:replace="~{fragments/layout :: icon('dashboard')}"></svg> 대시보드
        </a>
        <a th:href="@{/compare}" th:classappend="${active == 'compare'} ? 'active'">
            <svg th:replace="~{fragments/layout :: icon('compare')}"></svg> 브랜치 비교
        </a>
        <a th:href="@{/flyway}" th:classappend="${active == 'flyway'} ? 'active'">
            <svg th:replace="~{fragments/layout :: icon('filePlus')}"></svg> Flyway 관리
        </a>
    </nav>
    <span class="spacer"></span>
    <span class="br-conn" th:if="${connected != null}">
        <span class="dot" th:style="${connected} ? '--st-c: var(--br-ok)' : '--st-c: var(--br-danger)'"></span>
        <span th:text="${connected} ? 'GitLab 연결됨' : 'GitLab 연결 안 됨'"></span>
    </span>
    <span class="st st-warn" th:unless="${tokenConfigured}" title="application.yml 의 branch-radar.gitlab.token 이 비어 있습니다 (공개 프로젝트만 조회 가능)">토큰 없음</span>
</header>

<!-- ============================================================ SQL 미리보기 모달 (내용은 textContent 로만 채움 → XSS 방지) -->
<div th:fragment="sqlModal" class="modal fade" id="sqlModal" th:data-api="@{/api/sql}" tabindex="-1" aria-labelledby="sqlModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div class="min-w-0">
                    <h5 class="modal-title" id="sqlModalTitle">SQL</h5>
                    <div class="small text-muted-2 mono" id="sqlModalMeta"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body p-0">
                <div id="sqlModalError" class="notice notice-danger m-3 d-none"></div>
                <div id="sqlModalLoading" class="p-4 text-muted-2">불러오는 중…</div>
                <pre id="sqlModalContent" class="sql-preview d-none"></pre>
            </div>
            <div class="modal-footer">
                <span id="sqlCopyStatus" class="small text-ok me-auto"></span>
                <a id="sqlModalGitLab" class="btn btn-ghost btn-sm" href="#" target="_blank" rel="noopener noreferrer">
                    <svg th:replace="~{fragments/layout :: icon('external')}"></svg> GitLab 원본
                </a>
                <button id="sqlCopyBtn" type="button" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1" disabled>
                    <svg th:replace="~{fragments/layout :: icon('copy')}"></svg> 복사
                </button>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
